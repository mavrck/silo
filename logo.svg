<svg width="340" height="150" viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Silo RSS</title>
  <desc>A low-poly grain silo mark, gold facets on a forest green badge, next to the Silo RSS wordmark.</desc>

  <rect x="10" y="10" width="130" height="130" rx="20" fill="#2F4B33"/>

  <line x1="75" y1="35" x2="75" y2="27" stroke="#F2E4C4" stroke-width="2" stroke-linecap="round"/>
  <circle cx="75" cy="24" r="2.5" fill="#F2E4C4"/>

  <polygon points="75,35 51,55 75,55" fill="#E8B84B"/>
  <polygon points="75,35 75,55 99,55" fill="#C48F35"/>

  <rect x="51" y="55" width="24" height="55" fill="#D9A441"/>
  <rect x="75" y="55" width="24" height="55" fill="#B9792B"/>

  <line x1="51" y1="68" x2="99" y2="68" stroke="#2F4B33" stroke-width="2"/>
  <line x1="51" y1="80" x2="99" y2="80" stroke="#2F4B33" stroke-width="2"/>
  <line x1="51" y1="92" x2="99" y2="92" stroke="#2F4B33" stroke-width="2"/>

  <polygon points="51,110 75,110 75,123 68,123" fill="#C48F35"/>
  <polygon points="75,110 99,110 82,123 75,123" fill="#8B5A2B"/>
  <circle cx="75" cy="123" r="3" fill="#F2D9A0"/>

  <line x1="68" y1="123" x2="62" y2="138" stroke="#F2E4C4" stroke-width="3" stroke-linecap="round"/>
  <line x1="82" y1="123" x2="88" y2="138" stroke="#F2E4C4" stroke-width="3" stroke-linecap="round"/>
  <line x1="57" y1="140" x2="93" y2="140" stroke="#F2E4C4" stroke-width="2" stroke-linecap="round"/>

  <text x="160" y="82" font-size="34" font-weight="700" font-family="sans-serif">
    <tspan fill="#3B2A1E">Silo</tspan><tspan fill="#2F4B33" dx="6">RSS</tspan>
  </text>
  <text x="161" y="102" font-size="12" fill="#7A6A55" font-family="sans-serif">Grain by grain.</text>
</svg>
